<script>
    async function hitung() {
        const jml = document.getElementById('jumlah').value;
        const jns = document.getElementById('jenis').value;
        const resDiv = document.getElementById('result');
        
        // Perhatiin tanda BACKTICK ( ` ) di awal ama akhir URL!
        const apiUrl = `https://app-serverless-046-d3guf0fsaehxaxfa.indonesiacentral-01.azurewebsites.net/estimasi?jumlah=${jml}&jenis=${jns}`;

        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error('Servernya ngambek');
            
            const data = await response.json();
            resDiv.style.display = 'block';
            resDiv.innerHTML = `
                <strong>Total: Rp${data.total.toLocaleString()}</strong><br>
                <small>Harga per peserta: Rp${data.hargaPerPeserta.toLocaleString()}</small><br>
                <small>Time: ${data.timestamp}</small>
            `;
        } catch (err) {
            console.error(err);
            alert('Gagal nembak API. Pastiin App Service udah nyala dan CORS udah di-set ke *');
        }
    }
</script>
